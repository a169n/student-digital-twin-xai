[project]
name = "sdtxai-api"
version = "0.1.0"
description = "FastAPI scaffold for student digital twin xai prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.5.7",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
