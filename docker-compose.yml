services:
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/sdtxai
    volumes:
      - ./apps/api:/app
    depends_on:
      - postgres

  ml:
    build:
      context: ./services/ml
    environment:
      ML_ENV: development
      DATA_RAW_DIR: /workspace/data/raw
      DATA_PROCESSED_DIR: /workspace/data/processed
      DATA_ARTIFACTS_DIR: /workspace/data/artifacts
    volumes:
      - ./services/ml:/app
      - ./data:/workspace/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sdtxai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
